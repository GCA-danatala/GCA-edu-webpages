<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Compass</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
}

h1 {
    margin-bottom: 12px;
    font-size: 1.6rem;
}

.mode {
    font-size: 0.9rem;
    opacity: 0.7;
    margin-bottom: 8px;
}

.compass {
    position: relative;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 8px solid #444;
    background: radial-gradient(circle, #222 60%, #000 100%);
    margin-bottom: 18px;
    overflow: hidden;
    transition: width 0.2s, height 0.2s;
}

.compass.laptop {
    width: 240px;
    height: 240px;
}

.rose {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transition: transform 0.12s linear;
}

.tick {
    position: absolute;
    left: 50%;
    top: 12px;
    width: 2px;
    background: #666;
    transform-origin: center 138px;
}

.compass.laptop .tick {
    transform-origin: center 108px;
}

.tick.minor { height: 8px; }
.tick.major { height: 16px; background: #aaa; }

.label {
    position: absolute;
    left: 50%;
    top: 18px;
    transform-origin: center 132px;
    transform: translateX(-50%);
    font-size: 0.9rem;
    color: #ddd;
    white-space: nowrap;
}

.compass.laptop .label {
    transform-origin: center 102px;
    font-size: 0.8rem;
}

.label.major { font-weight: bold; color: #fff; }
.label.north { color: #f44; }

.needle {
    position: absolute;
    width: 4px;
    height: 130px;
    background: red;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 2px;
    z-index: 5;
}

.compass.laptop .needle {
    height: 100px;
}

.readout {
    font-size: 1.4rem;
}

.degrees {
    font-size: 1.1rem;
    opacity: 0.8;
}

.controls {
    margin-top: 10px;
}

button {
    margin: 6px;
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2d7cff;
    color: #fff;
    cursor: pointer;
}

.status {
    margin-top: 8px;
    font-size: 0.85rem;
    opacity: 0.6;
}
</style>
</head>

<body>
<div class="container">
    <h1>Digital Compass</h1>
    <div class="mode" id="modeLabel">Mode: Tablet</div>

    <div class="compass" id="compass">
        <div class="rose" id="rose"></div>
        <div class="needle"></div>
    </div>

    <div class="readout" id="direction">--</div>
    <div class="degrees" id="degrees">--°</div>

    <div class="controls">
        <button id="calibrate">North (Calibrate)</button>
        <button id="toggleMode">Switch to Laptop Mode</button>
    </div>

    <div class="status" id="status">Waiting for sensor…</div>
</div>

<script>
let mode = "tablet";
let currentHeading = 0;
let calibrationOffset = 0;

let lastAngle = 0;
let smoothAngle = 0;

const compassEl = document.getElementById("compass");
const rose = document.getElementById("rose");
const directionEl = document.getElementById("direction");
const degreesEl = document.getElementById("degrees");
const statusEl = document.getElementById("status");
const modeLabel = document.getElementById("modeLabel");
const toggleBtn = document.getElementById("toggleMode");

function getDirection(deg) {
    const dirs = ["N","NE","E","SE","S","SW","W","NW"];
    return dirs[Math.round(deg / 45) % 8];
}

function buildCompassRose() {
    rose.innerHTML = "";

    for (let d = 0; d < 360; d += 5) {
        const tick = document.createElement("div");
        tick.className = "tick " + (d % 30 === 0 ? "major" : "minor");
        tick.style.transform = `rotate(${d}deg)`;
        rose.appendChild(tick);
    }

    const labels = [
        { d: 0, t: "N", c: "major north" },
        { d: 45, t: "NE" },
        { d: 90, t: "E", c: "major" },
        { d: 135, t: "SE" },
        { d: 180, t: "S", c: "major" },
        { d: 225, t: "SW" },
        { d: 270, t: "W", c: "major" },
        { d: 315, t: "NW" }
    ];

    labels.forEach(l => {
        const label = document.createElement("div");
        label.className = `label ${l.c || ""}`;
        label.style.transform = `translateX(-50%) rotate(${l.d}deg)`;
        label.textContent = l.t;
        rose.appendChild(label);
    });
}

function updateCompass(heading) {
    const adjusted = (heading + calibrationOffset + 360) % 360;

    let delta = adjusted - lastAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    smoothAngle += delta;
    lastAngle = adjusted;

    rose.style.transform = `rotate(${-smoothAngle}deg)`;

    directionEl.textContent = getDirection(adjusted);
    degreesEl.textContent = `${Math.round(adjusted)}°`;
}

function handleOrientation(e) {
    if (mode !== "tablet") return;

    let heading;
    if (e.webkitCompassHeading !== undefined) {
        heading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
        heading = 360 - e.alpha;
    } else return;

    currentHeading = heading;
    updateCompass(heading);
    statusEl.textContent = "Sensor active";
}

function handleMouse(e) {
    if (mode !== "laptop") return;

    const percent = e.clientX / window.innerWidth;
    currentHeading = percent * 360;
    updateCompass(currentHeading);
    statusEl.textContent = "Mouse input active";
}

async function initSensors() {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
        try {
            const p = await DeviceOrientationEvent.requestPermission();
            if (p === "granted") {
                window.addEventListener("deviceorientation", handleOrientation, true);
                statusEl.textContent = "Sensor permission granted";
            } else {
                statusEl.textContent = "Sensor permission denied";
            }
        } catch {
            statusEl.textContent = "Sensor error";
        }
    } else {
        window.addEventListener("deviceorientationabsolute", handleOrientation, true);
        window.addEventListener("deviceorientation", handleOrientation, true);
        statusEl.textContent = "Listening for sensor";
    }
}

document.getElementById("calibrate").onclick = () => {
    calibrationOffset = -currentHeading;
    lastAngle = 0;
    smoothAngle = 0;
};

toggleBtn.onclick = () => {
    mode = mode === "tablet" ? "laptop" : "tablet";

    compassEl.classList.toggle("laptop", mode === "laptop");
    modeLabel.textContent = `Mode: ${mode === "tablet" ? "Tablet" : "Laptop"}`;
    toggleBtn.textContent = `Switch to ${mode === "tablet" ? "Laptop" : "Tablet"} Mode`;

    lastAngle = 0;
    smoothAngle = 0;

    statusEl.textContent = mode === "tablet"
        ? "Using device sensors"
        : "Using mouse input";
};

window.addEventListener("mousemove", handleMouse);

buildCompassRose();
initSensors();
</script>
</body>
</html>
