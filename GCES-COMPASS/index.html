<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Compass</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
}

.compass {
    position: relative;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 8px solid #444;
    background: radial-gradient(circle, #222 60%, #000 100%);
    margin-bottom: 20px;
}

.rose {
    position: absolute;
    inset: 0;
    border-radius: 50%;
}

.tick {
    position: absolute;
    width: 2px;
    background: #666;
    top: 10px;
    left: 50%;
    transform-origin: center 130px;
}

.tick.major {
    height: 18px;
    background: #aaa;
}

.tick.minor {
    height: 10px;
}

.label {
    position: absolute;
    width: 40px;
    text-align: center;
    left: 50%;
    top: 14px;
    transform-origin: center 126px;
    font-size: 0.9rem;
    color: #ddd;
}

.label.major {
    font-weight: bold;
    color: #fff;
}

.label.north {
    color: #f44;
}

.needle {
    position: absolute;
    width: 4px;
    height: 120px;
    background: red;
    top: 20px;
    left: 50%;
    transform-origin: bottom center;
    transform: translateX(-50%);
    border-radius: 2px;
    z-index: 5;
}

.readout {
    font-size: 1.4rem;
}

.degrees {
    font-size: 1.1rem;
    opacity: 0.8;
}

button {
    margin-top: 14px;
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2d7cff;
    color: #fff;
    cursor: pointer;
}

.status {
    margin-top: 8px;
    font-size: 0.85rem;
    opacity: 0.6;
}
</style>
</head>

<body>
<div class="container">
    <div class="compass">
        <div class="rose" id="rose"></div>
        <div class="needle" id="needle"></div>
    </div>

    <div class="readout" id="direction">--</div>
    <div class="degrees" id="degrees">--°</div>

    <button id="calibrate">North (Calibrate)</button>
    <div class="status" id="status">Waiting for sensor…</div>
</div>

<script>
let currentHeading = 0;
let calibrationOffset = 0;

const rose = document.getElementById("rose");
const needle = document.getElementById("needle");
const directionEl = document.getElementById("direction");
const degreesEl = document.getElementById("degrees");
const statusEl = document.getElementById("status");

function getDirection(deg) {
    const dirs = ["N","NE","E","SE","S","SW","W","NW"];
    return dirs[Math.round(deg / 45) % 8];
}

function buildCompassRose() {
    // Ticks every 5°
    for (let i = 0; i < 360; i += 5) {
        const tick = document.createElement("div");
        tick.classList.add("tick");

        if (i % 30 === 0) tick.classList.add("major");
        else tick.classList.add("minor");

        tick.style.transform = `rotate(${i}deg) translateX(-50%)`;
        rose.appendChild(tick);
    }

    // Cardinal & intercardinal labels
    const labels = [
        { d: 0, t: "N", c: "major north" },
        { d: 45, t: "NE" },
        { d: 90, t: "E", c: "major" },
        { d: 135, t: "SE" },
        { d: 180, t: "S", c: "major" },
        { d: 225, t: "SW" },
        { d: 270, t: "W", c: "major" },
        { d: 315, t: "NW" }
    ];

    labels.forEach(l => {
        const label = document.createElement("div");
        label.className = `label ${l.c || ""}`;
        label.style.transform = `rotate(${l.d}deg) translateX(-50%)`;
        label.textContent = l.t;
        rose.appendChild(label);
    });
}

function updateCompass(heading) {
    const adjusted = (heading + calibrationOffset + 360) % 360;

    needle.style.transform = `translateX(-50%) rotate(${adjusted}deg)`;
    rose.style.transform = `rotate(${-adjusted}deg)`;

    directionEl.textContent = getDirection(adjusted);
    degreesEl.textContent = `${Math.round(adjusted)}°`;
}

function handleOrientation(e) {
    let heading;

    if (e.webkitCompassHeading !== undefined) {
        heading = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
        heading = 360 - e.alpha;
    } else return;

    currentHeading = heading;
    updateCompass(heading);
    statusEl.textContent = "Sensor active";
}

async function initSensors() {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p === "granted") {
            window.addEventListener("deviceorientation", handleOrientation, true);
            statusEl.textContent = "Permission granted";
        } else {
            statusEl.textContent = "Permission denied";
        }
    } else {
        window.addEventListener("deviceorientationabsolute", handleOrientation, true);
        window.addEventListener("deviceorientation", handleOrientation, true);
        statusEl.textContent = "Listening for sensor";
    }
}

document.getElementById("calibrate").onclick = () => {
    calibrationOffset = -currentHeading;
};

buildCompassRose();
initSensors();
</script>
</body>
</html>
