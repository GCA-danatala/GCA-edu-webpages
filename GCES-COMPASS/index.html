<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Compass</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.container {
    text-align: center;
}

.compass {
    width: 280px;
    height: 280px;
    border: 8px solid #444;
    border-radius: 50%;
    position: relative;
    margin: 0 auto 20px;
    background: radial-gradient(circle, #222 60%, #000 100%);
    overflow: hidden;
}

.rose {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    transform-origin: center;
}

.tick {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 10px;
    background: #666;
    transform-origin: bottom center;
}

.tick.major {
    height: 16px;
    background: #aaa;
}

.label {
    position: absolute;
    top: 8px;
    left: 50%;
    transform-origin: center 132px;
    font-size: 0.9rem;
    color: #ddd;
}

.label.major {
    font-weight: bold;
    color: #fff;
}

.label.north {
    color: #f44;
}

.needle {
    position: absolute;
    width: 4px;
    height: 120px;
    background: red;
    top: 20px;
    left: 50%;
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);
    border-radius: 2px;
    z-index: 5;
}

.readout {
    font-size: 1.4rem;
    margin-bottom: 6px;
}

.degrees {
    font-size: 1.1rem;
    opacity: 0.85;
}

button {
    margin-top: 15px;
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2d7cff;
    color: #fff;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.status {
    margin-top: 10px;
    font-size: 0.85rem;
    opacity: 0.7;
}
</style>
</head>

<body>
<div class="container">
    <div class="compass">
        <div class="rose" id="rose"></div>
        <div class="needle" id="needle"></div>
    </div>

    <div class="readout" id="direction">--</div>
    <div class="degrees" id="degrees">--°</div>

    <button id="calibrate">North (Calibrate)</button>
    <div class="status" id="status">Waiting for sensor…</div>
</div>

<script>
let currentHeading = 0;
let calibrationOffset = 0;

const needle = document.getElementById("needle");
const rose = document.getElementById("rose");
const directionEl = document.getElementById("direction");
const degreesEl = document.getElementById("degrees");
const statusEl = document.getElementById("status");

function getDirection(deg) {
    const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
    return dirs[Math.round(deg / 45) % 8];
}

function buildCompassRose() {
    // Ticks
    for (let i = 0; i < 360; i += 5) {
        const tick = document.createElement("div");
        tick.className = "tick";
        if (i % 30 === 0) tick.classList.add("major");
        tick.style.transform = `translateX(-50%) rotate(${i}deg)`;
        rose.appendChild(tick);
    }

    // Labels
    const labels = [
        { deg: 0, text: "N", cls: "major north" },
        { deg: 45, text: "NE" },
        { deg: 90, text: "E", cls: "major" },
        { deg: 135, text: "SE" },
        { deg: 180, text: "S", cls: "major" },
        { deg: 225, text: "SW" },
        { deg: 270, text: "W", cls: "major" },
        { deg: 315, text: "NW" }
    ];

    labels.forEach(l => {
        const label = document.createElement("div");
        label.className = `label ${l.cls || ""}`;
        label.style.transform = `rotate(${l.deg}deg)`;
        label.textContent = l.text;
        rose.appendChild(label);
    });
}

function updateCompass(heading) {
    const adjusted = (heading + calibrationOffset + 360) % 360;

    needle.style.transform = `translateX(-50%) rotate(${adjusted}deg)`;
    rose.style.transform = `rotate(${-adjusted}deg)`;

    directionEl.textContent = getDirection(adjusted);
    degreesEl.textContent = `${Math.round(adjusted)}°`;
}

function handleOrientation(event) {
    let heading;

    if (event.webkitCompassHeading !== undefined) {
        heading = event.webkitCompassHeading;
    } else if (event.alpha !== null) {
        heading = 360 - event.alpha;
    } else {
        return;
    }

    currentHeading = heading;
    updateCompass(heading);
    statusEl.textContent = "Sensor active";
}

async function initSensors() {
    if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
        try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission === "granted") {
                window.addEventListener("deviceorientation", handleOrientation, true);
                statusEl.textContent = "Permission granted";
            } else {
                statusEl.textContent = "Permission denied";
            }
        } catch {
            statusEl.textContent = "Sensor error";
        }
    } else {
        window.addEventListener("deviceorientationabsolute", handleOrientation, true);
        window.addEventListener("deviceorientation", handleOrientation, true);
        statusEl.textContent = "Listening for sensor";
    }
}

document.getElementById("calibrate").addEventListener("click", () => {
    calibrationOffset = -currentHeading;
});

buildCompassRose();
initSensors();
</script>
</body>
</html>
